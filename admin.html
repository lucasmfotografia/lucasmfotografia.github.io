<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel | LucasM. Fotografia</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --purple: #5B2D8E;
    --purple-light: #7B4DB0;
    --purple-pale: #EDE5F8;
    --purple-dim: #3D1E60;
    --bg: #FFFFFF;
    --bg-2: #F7F4FC;
    --text: #1A1020;
    --muted: #6B5F80;
    --border: rgba(91,45,142,0.15);
    --border-strong: rgba(91,45,142,0.3);
    --red: #b3413a;
  }

  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-weight: 300; min-height: 100vh; }

  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    padding: 1rem 4rem;
    display: flex; justify-content: space-between; align-items: center;
    background: #0a0008; border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .logo-text { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; letter-spacing: 0.1em; color: #fff; text-decoration: none; }
  .logo-text span { color: #9B6DD0; }
  #logoutBtn {
    background: transparent; border: 1px solid rgba(255,255,255,0.3); color: rgba(255,255,255,0.85);
    padding: 0.5rem 1.2rem; font-size: 0.72rem; letter-spacing: 0.15em; text-transform: uppercase;
    cursor: pointer; font-family: 'DM Sans', sans-serif; transition: border-color 0.3s, background 0.3s;
  }
  #logoutBtn:hover { border-color: #fff; background: rgba(255,255,255,0.08); }

  main { padding: 7.5rem 4rem 5rem; max-width: 1100px; margin: 0 auto; }

  .eyebrow { font-size: 0.65rem; letter-spacing: 0.5em; text-transform: uppercase; color: var(--purple); margin-bottom: 0.6rem; }
  h1 { font-family: 'Bebas Neue', sans-serif; font-size: clamp(2.2rem, 4.5vw, 3rem); letter-spacing: 0.02em; margin-bottom: 3rem; }
  h2 { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; letter-spacing: 0.03em; margin-bottom: 1.2rem; }

  /* LOGIN GATE */
  .login-gate { max-width: 400px; margin: 6rem auto; text-align: center; }
  .login-gate form { display: flex; flex-direction: column; gap: 1rem; margin-top: 2rem; text-align: left; }
  .login-gate p.desc { font-family: 'Cormorant Garamond', serif; font-style: italic; color: var(--muted); font-size: 1.05rem; }

  label { font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.4rem; display: block; }
  input, select {
    width: 100%; background: var(--bg-2); border: 1px solid var(--border); color: var(--text);
    padding: 0.8rem 1rem; font-family: 'DM Sans', sans-serif; font-size: 0.9rem; font-weight: 400;
    transition: border-color 0.3s, background 0.3s;
  }
  input:focus, select:focus { outline: none; border-color: var(--purple); background: var(--bg); }

  .btn {
    background: var(--purple); color: #fff; padding: 0.85rem 1.6rem; font-size: 0.75rem;
    letter-spacing: 0.15em; text-transform: uppercase; border: none; cursor: pointer;
    font-family: 'DM Sans', sans-serif; font-weight: 500; transition: background 0.3s;
  }
  .btn:hover { background: var(--purple-light); }
  .btn:disabled { opacity: 0.6; cursor: default; }
  .btn-outline {
    background: transparent; color: var(--purple); border: 1px solid var(--border-strong);
    padding: 0.6rem 1.2rem; font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase;
    cursor: pointer; font-family: 'DM Sans', sans-serif;
  }
  .btn-outline:hover { background: var(--purple-pale); }

  .msg { font-size: 0.82rem; padding: 0.8rem 1rem; border-left: 3px solid var(--purple); background: var(--purple-pale); color: var(--purple-dim); display: none; margin-top: 1rem; }
  .msg.error { border-color: var(--red); background: #fbeae8; color: #8a2f28; }
  .msg.show { display: block; }

  /* CARDS */
  .card {
    border: 1px solid var(--border); padding: 2rem; margin-bottom: 3rem; background: var(--bg-2);
  }
  .form-row { display: grid; grid-template-columns: 1.6fr 1fr 1fr 1fr auto; gap: 1rem; align-items: end; }
  .form-row > div { display: flex; flex-direction: column; }

  .gallery-list { display: flex; flex-direction: column; gap: 1px; background: var(--border); border: 1px solid var(--border); }
  .gallery-item { background: var(--bg); padding: 1.5rem; display: grid; grid-template-columns: 1fr auto auto auto auto; gap: 1.5rem; align-items: center; }
  .gallery-item .name { font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; letter-spacing: 0.03em; }
  .gallery-item .meta { font-size: 0.78rem; color: var(--muted); margin-top: 0.2rem; }
  .gallery-item .meta.expired { color: var(--red); }
  .gallery-item input[type="file"] { font-size: 0.78rem; max-width: 220px; }
  .upload-status { font-size: 0.75rem; color: var(--muted); margin-top: 0.4rem; display: flex; align-items: center; gap: 0.6rem; }
  .cancel-upload-btn {
    display: none;
    background: transparent; border: 1px solid var(--red); color: var(--red);
    padding: 0.2rem 0.6rem; font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase;
    cursor: pointer; font-family: 'DM Sans', sans-serif;
  }
  .cancel-upload-btn:hover { background: #fbeae8; }

  .link-box { display: flex; gap: 0.5rem; align-items: center; }
  .link-box input { font-size: 0.78rem; background: var(--bg); }

  @media (max-width: 900px) {
    nav { padding: 1rem 1.5rem; }
    main { padding: 6.5rem 1.5rem 3rem; }
    .form-row { grid-template-columns: 1fr; }
    .gallery-item { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo-text">LUCASM<span>.</span></a>
  <button id="logoutBtn" style="display:none;">Sair</button>
</nav>

<main>

  <div class="login-gate" id="loginGate">
    <div class="eyebrow">Painel administrativo</div>
    <h1 style="margin-bottom:0.5rem;">Acesso restrito</h1>
    <p class="desc">Entre com sua conta de administrador para gerenciar as galerias.</p>
    <div id="loginMsg" class="msg"></div>
    <form id="loginForm">
      <div>
        <label for="adminEmail">E-mail</label>
        <input type="email" id="adminEmail" required autocomplete="email">
      </div>
      <div>
        <label for="adminPassword">Senha</label>
        <input type="password" id="adminPassword" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn" id="loginBtn">Entrar</button>
    </form>
  </div>

  <div id="panel" style="display:none;">
    <div class="eyebrow">Painel administrativo</div>
    <h1>Suas galerias</h1>

    <div class="card">
      <h2>Criar nova galeria</h2>
      <div id="createMsg" class="msg"></div>
      <form id="createForm">
        <div class="form-row">
          <div>
            <label for="galName">Nome da galeria</label>
            <input type="text" id="galName" placeholder="Ex: Casamento Maria e João" required>
          </div>
          <div>
            <label for="galSlug">Link personalizado (opcional)</label>
            <input type="text" id="galSlug" placeholder="ex: lucas-ensaio">
          </div>
          <div>
            <label for="galExpires">Expira em</label>
            <input type="date" id="galExpires">
          </div>
          <div>
            <label for="galCode">Código de acesso</label>
            <input type="text" id="galCode" placeholder="ex: MARIA2026">
          </div>
          <button type="submit" class="btn">Criar</button>
        </div>
      </form>
    </div>

    <h2>Galerias existentes</h2>
    <div class="gallery-list" id="galleryList"></div>
  </div>

</main>

<script type="module">
  import { supabaseUrl, supabaseAnonKey } from './supabase-config.js';
  import { workerUrl } from './worker-config.js';
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  const supabase = createClient(supabaseUrl, supabaseAnonKey);
  const BUCKET = 'gallery-photos';

  const loginGate = document.getElementById('loginGate');
  const panel = document.getElementById('panel');
  const logoutBtn = document.getElementById('logoutBtn');
  const loginMsg = document.getElementById('loginMsg');
  const createMsg = document.getElementById('createMsg');
  const galleryList = document.getElementById('galleryList');

  function showMsg(el, text, isError) {
    el.textContent = text;
    el.className = 'msg show' + (isError ? ' error' : '');
  }

  function openCoverPicker(g, photos) {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(10,0,8,0.85);z-index:300;display:flex;align-items:center;justify-content:center;padding:2rem;';

    const box = document.createElement('div');
    box.style.cssText = 'background:#fff;max-width:1100px;width:95%;max-height:90vh;overflow-y:auto;padding:2rem;';
    box.innerHTML = `
      <h2 style="margin-bottom:1.2rem;">Escolha a foto de capa de "${g.name}"</h2>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;" id="coverPickerGrid"></div>
      <button class="btn-outline" type="button" id="coverPickerClose" style="margin-top:1.5rem;">Cancelar</button>
    `;
    overlay.appendChild(box);
    document.body.appendChild(overlay);

    const grid = box.querySelector('#coverPickerGrid');
    photos.forEach((photo) => {
      const thumb = document.createElement('img');
      thumb.src = photo.url;
      thumb.style.cssText = 'width:100%;aspect-ratio:1;object-fit:cover;cursor:pointer;border:2px solid transparent;';
      thumb.addEventListener('mouseenter', () => thumb.style.borderColor = 'var(--purple)');
      thumb.addEventListener('mouseleave', () => thumb.style.borderColor = 'transparent');
      thumb.addEventListener('click', async () => {
        await supabase.from('galleries').update({ cover_photo_url: photo.url }).eq('id', g.id);
        document.body.removeChild(overlay);
        await loadGalleries();
      });
      grid.appendChild(thumb);
    });

    box.querySelector('#coverPickerClose').addEventListener('click', () => {
      document.body.removeChild(overlay);
    });
  }

  function slugify(text) {
    return text.toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/(^-|-$)/g, '')
      + '-' + Math.random().toString(36).slice(2, 6);
  }

  function slugifyExact(text) {
    return text.toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/(^-|-$)/g, '');
  }

  function randomCode() {
    return Math.random().toString(36).slice(2, 8).toUpperCase();
  }

  async function checkSession() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) {
      loginGate.style.display = 'block';
      panel.style.display = 'none';
      logoutBtn.style.display = 'none';
      return;
    }
    const { data: adminRow } = await supabase.from('admins').select('id').eq('id', session.user.id).maybeSingle();
    if (!adminRow) {
      showMsg(loginMsg, 'Essa conta não tem permissão de administrador.', true);
      await supabase.auth.signOut();
      return;
    }
    loginGate.style.display = 'none';
    panel.style.display = 'block';
    logoutBtn.style.display = 'inline-block';
    await loadGalleries();
  }

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('adminEmail').value.trim();
    const password = document.getElementById('adminPassword').value;
    const btn = document.getElementById('loginBtn');
    btn.disabled = true; btn.textContent = 'Entrando...';

    const { error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) {
      showMsg(loginMsg, 'E-mail ou senha incorretos.', true);
      btn.disabled = false; btn.textContent = 'Entrar';
      return;
    }
    await checkSession();
  });

  logoutBtn.addEventListener('click', async () => {
    await supabase.auth.signOut();
    checkSession();
  });

  document.getElementById('createForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('galName').value.trim();
    const expiresInput = document.getElementById('galExpires').value;
    let code = document.getElementById('galCode').value.trim();
    if (!code) code = randomCode();

    const customSlugInput = document.getElementById('galSlug').value.trim();
    const slug = customSlugInput ? slugifyExact(customSlugInput) : slugify(name);

    const { error } = await supabase.from('galleries').insert({
      name,
      slug,
      access_code: code,
      expires_at: expiresInput || null
    });

    if (error) {
      const msg = error.message.includes('duplicate')
        ? `Esse link já está sendo usado por outra galeria. Escolha outro em "Link personalizado".`
        : 'Não consegui criar a galeria: ' + error.message;
      showMsg(createMsg, msg, true);
      return;
    }

    showMsg(createMsg, `Galeria criada! Código: ${code} — link: ...?g=${slug}`, false);
    document.getElementById('createForm').reset();
    await loadGalleries();
  });

  async function loadGalleries() {
    const { data: galleries, error } = await supabase
      .from('galleries')
      .select('id, slug, name, access_code, expires_at, created_at, cover_photo_url, cover_message, cover_position')
      .order('created_at', { ascending: false });

    galleryList.innerHTML = '';
    if (error || !galleries || galleries.length === 0) {
      galleryList.innerHTML = '<div class="gallery-item"><p style="color:var(--muted);">Nenhuma galeria criada ainda.</p></div>';
      return;
    }

    galleries.forEach((g) => {
      const isExpired = g.expires_at && new Date(g.expires_at) < new Date(new Date().toDateString());
      const link = `${window.location.origin}${window.location.pathname.replace('admin.html', 'login.html')}?g=${g.slug}`;

      const item = document.createElement('div');
      item.className = 'gallery-item';
      item.innerHTML = `
        <div>
          <div class="name">${g.name}</div>
          <div class="meta ${isExpired ? 'expired' : ''}">
            ${g.expires_at ? 'Expira em ' + new Date(g.expires_at + 'T00:00:00').toLocaleDateString('pt-BR') : 'Sem expiração'}
            ${isExpired ? ' · EXPIRADA' : ''}
          </div>
          <div class="code-box" style="margin-top:0.5rem; display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap;">
            <label style="margin-bottom:0;">Código:</label>
            <input type="text" class="code-input" value="${g.access_code}" style="max-width:160px; text-transform:uppercase;">
            <button class="btn-outline save-code-btn" type="button">Salvar</button>
            <span class="code-msg" style="font-size:0.75rem;"></span>
          </div>
          <div class="expiry-box" style="margin-top:0.5rem; display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap;">
            <label style="margin-bottom:0;">Expira em:</label>
            <input type="date" class="expiry-input" value="${g.expires_at || ''}" style="max-width:170px;">
            <button class="btn-outline save-expiry-btn" type="button">Salvar</button>
            <span class="expiry-msg" style="font-size:0.75rem;"></span>
          </div>
          <div class="cover-box" style="margin-top:0.5rem; display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap;">
            <label style="margin-bottom:0;">Mensagem na capa:</label>
            <input type="text" class="cover-msg-input" value="${g.cover_message || ''}" placeholder="Ex: um dia lindo pra guardar" style="max-width:220px;">
            <button class="btn-outline save-cover-msg-btn" type="button">Salvar</button>
            <button class="btn-outline choose-cover-btn" type="button">${g.cover_photo_url ? 'Trocar capa' : 'Escolher capa'}</button>
            ${g.cover_photo_url ? `
            <label style="margin-bottom:0;">Área visível:</label>
            <select class="cover-position-select" style="max-width:120px;">
              <option value="top" ${g.cover_position === 'top' ? 'selected' : ''}>Topo</option>
              <option value="center" ${!g.cover_position || g.cover_position === 'center' ? 'selected' : ''}>Centro</option>
              <option value="bottom" ${g.cover_position === 'bottom' ? 'selected' : ''}>Base</option>
            </select>
            ` : ''}
            <span class="cover-status-msg" style="font-size:0.75rem;"></span>
            ${g.cover_photo_url ? `<img src="${g.cover_photo_url}" style="width:48px;height:48px;object-fit:cover;border:1px solid var(--border-strong);">` : ''}
          </div>
          <div class="link-box" style="margin-top:0.6rem;">
            <input type="text" readonly value="${link}">
            <button class="btn-outline copy-btn" type="button">Copiar link</button>
          </div>
        </div>
        <button class="btn-outline view-btn" type="button">Visualizar</button>
        <div>
          <label style="margin-bottom:0.3rem;">Adicionar fotos</label>
          <input type="file" multiple accept="image/*" class="photo-input">
          <div class="upload-status">
            <span class="upload-text"></span>
            <button class="cancel-upload-btn" type="button">Cancelar</button>
          </div>
        </div>
        <button class="btn-outline delete-btn" type="button">Excluir galeria</button>
      `;

      item.querySelector('.view-btn').addEventListener('click', async () => {
        const viewBtn = item.querySelector('.view-btn');
        viewBtn.disabled = true;
        viewBtn.textContent = 'Carregando...';

        let photos = [];
        try {
          const res = await fetch(`${workerUrl}/list?gallery=${g.id}`);
          const listData = await res.json();
          photos = listData.photos || [];
        } catch (err) {
          photos = [];
        }

        viewBtn.disabled = false;
        viewBtn.textContent = 'Visualizar';

        if (photos.length === 0) {
          alert('Essa galeria ainda não tem fotos.');
          return;
        }

        sessionStorage.setItem('galleryData', JSON.stringify({ name: g.name, photos }));
        window.open('galeria-cliente.html', '_blank');
      });

      item.querySelector('.copy-btn').addEventListener('click', () => {
        navigator.clipboard.writeText(link);
        item.querySelector('.copy-btn').textContent = 'Copiado!';
        setTimeout(() => { item.querySelector('.copy-btn').textContent = 'Copiar link'; }, 1500);
      });

      item.querySelector('.save-code-btn').addEventListener('click', async () => {
        const codeInput = item.querySelector('.code-input');
        const codeMsg = item.querySelector('.code-msg');
        const newCode = codeInput.value.trim().toUpperCase();

        if (!newCode) {
          codeMsg.style.color = 'var(--red)';
          codeMsg.textContent = 'O código não pode ficar vazio.';
          return;
        }

        const { error } = await supabase
          .from('galleries')
          .update({ access_code: newCode })
          .eq('id', g.id);

        if (error) {
          codeMsg.style.color = 'var(--red)';
          codeMsg.textContent = 'Erro ao salvar.';
          return;
        }

        codeInput.value = newCode;
        codeMsg.style.color = 'var(--purple)';
        codeMsg.textContent = 'Salvo!';
        setTimeout(() => { codeMsg.textContent = ''; }, 2000);
      });

      item.querySelector('.save-expiry-btn').addEventListener('click', async () => {
        const expiryInput = item.querySelector('.expiry-input');
        const expiryMsg = item.querySelector('.expiry-msg');
        const newExpiry = expiryInput.value || null;

        const { error } = await supabase
          .from('galleries')
          .update({ expires_at: newExpiry })
          .eq('id', g.id);

        if (error) {
          expiryMsg.style.color = 'var(--red)';
          expiryMsg.textContent = 'Erro ao salvar.';
          return;
        }

        expiryMsg.style.color = 'var(--purple)';
        expiryMsg.textContent = 'Salvo!';
        setTimeout(() => { expiryMsg.textContent = ''; loadGalleries(); }, 1200);
      });

      item.querySelector('.save-cover-msg-btn').addEventListener('click', async () => {
        const msgInput = item.querySelector('.cover-msg-input');
        const statusEl = item.querySelector('.cover-status-msg');
        const newMsg = msgInput.value.trim() || null;

        const { error } = await supabase
          .from('galleries')
          .update({ cover_message: newMsg })
          .eq('id', g.id);

        statusEl.style.color = error ? 'var(--red)' : 'var(--purple)';
        statusEl.textContent = error ? 'Erro ao salvar.' : 'Salvo!';
        setTimeout(() => { statusEl.textContent = ''; }, 1500);
      });

      item.querySelector('.choose-cover-btn').addEventListener('click', async () => {
        const chooseBtn = item.querySelector('.choose-cover-btn');
        chooseBtn.disabled = true;
        chooseBtn.textContent = 'Carregando...';

        let photos = [];
        try {
          const res = await fetch(`${workerUrl}/list?gallery=${g.id}`);
          const listData = await res.json();
          photos = listData.photos || [];
        } catch (err) {
          photos = [];
        }

        chooseBtn.disabled = false;
        chooseBtn.textContent = g.cover_photo_url ? 'Trocar capa' : 'Escolher capa';

        if (photos.length === 0) {
          alert('Envie fotos nessa galeria antes de escolher a capa.');
          return;
        }

        openCoverPicker(g, photos);
      });

      const positionSelect = item.querySelector('.cover-position-select');
      if (positionSelect) {
        positionSelect.addEventListener('change', async () => {
          await supabase.from('galleries').update({ cover_position: positionSelect.value }).eq('id', g.id);
        });
      }

      item.querySelector('.photo-input').addEventListener('change', async (e) => {
        const files = Array.from(e.target.files);
        const statusText = item.querySelector('.upload-text');
        const cancelBtn = item.querySelector('.cancel-upload-btn');
        let cancelled = false;

        cancelBtn.style.display = 'inline-block';
        cancelBtn.onclick = () => {
          cancelled = true;
          statusText.textContent = 'Cancelando... (a foto atual termina de enviar)';
        };

        const { data: { session } } = await supabase.auth.getSession();
        if (!session) {
          statusText.textContent = 'Sessão expirada. Atualize a página e entre de novo.';
          cancelBtn.style.display = 'none';
          return;
        }

        let sentCount = 0;
        for (let i = 0; i < files.length; i++) {
          if (cancelled) break;
          statusText.textContent = `Enviando ${i + 1} de ${files.length}...`;

          try {
            const res = await fetch(`${workerUrl}/upload`, {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${session.access_token}`,
                'Content-Type': files[i].type || 'application/octet-stream',
                'x-gallery-id': g.id,
                'x-file-name': files[i].name
              },
              body: files[i]
            });
            if (!res.ok) {
              const err = await res.json().catch(() => ({}));
              statusText.textContent = `Erro ao enviar ${files[i].name}: ${err.error || res.statusText}`;
              cancelBtn.style.display = 'none';
              return;
            }
          } catch (err) {
            statusText.textContent = `Erro de conexão ao enviar ${files[i].name}.`;
            cancelBtn.style.display = 'none';
            return;
          }
          sentCount++;
        }

        cancelBtn.style.display = 'none';
        statusText.textContent = cancelled
          ? `Cancelado. ${sentCount} de ${files.length} foto(s) enviada(s) antes de parar.`
          : `${sentCount} foto(s) enviada(s) com sucesso.`;
        e.target.value = '';
      });

      item.querySelector('.delete-btn').addEventListener('click', async () => {
        if (!confirm(`Excluir a galeria "${g.name}"? As fotos dela também serão apagadas do armazenamento e isso não pode ser desfeito.`)) return;

        const deleteBtn = item.querySelector('.delete-btn');
        deleteBtn.disabled = true;
        deleteBtn.textContent = 'Excluindo...';

        const { data: { session } } = await supabase.auth.getSession();
        if (session) {
          try {
            await fetch(`${workerUrl}/gallery?gallery=${g.id}`, {
              method: 'DELETE',
              headers: { 'Authorization': `Bearer ${session.access_token}` }
            });
          } catch (err) {
            // segue mesmo se falhar em apagar as fotos, pra não travar a exclusão da galeria
          }
        }

        await supabase.from('galleries').delete().eq('id', g.id);
        await loadGalleries();
      });

      galleryList.appendChild(item);
    });
  }

  checkSession();
</script>

</body>
</html>
